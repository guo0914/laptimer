# GitHub Actions：用云端 macOS 构建 iOS 包
#
# 用法：
#   1. 把 timer-app/ios/LapTimer 目录内容推到 GitHub 仓库（让它成为仓库根）
#   2. 仓库 Settings → Secrets and variables → Actions 里加：
#        TEAM_ID                    你的 Apple Team ID（开发者账号页面可见）
#        BUILD_CERTIFICATE_BASE64   .p12 证书的 base64
#        P12_PASSWORD               .p12 密码
#        PROVISIONING_PROFILE_BASE64 描述文件的 base64
#   3. Actions 里手动触发 "iOS Build"
#
# 没有签名 secrets 时，流程仍会跑完自检与逻辑测试，只是不产出 ipa。

name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LapTimer/**"
      - "Scripts/**"

jobs:
  build:
    name: Build LapTimer
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 自检脚本（无需签名即可跑）
        run: |
          python3 Scripts/structure-check.py
          python3 Scripts/api-check.py
          python3 Scripts/check-project.py

      - name: 逻辑自检
        run: |
          swiftc LapTimer/TimeFormatting.swift Scripts/logic-check.swift -o /tmp/logiccheck
          /tmp/logiccheck

      - name: 安装签名证书与描述文件
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p runner $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p runner $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k runner $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 归档
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          xcodebuild archive \
            -project LapTimer.xcodeproj \
            -scheme LapTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LapTimer.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

      - name: 导出 ipa
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LapTimer.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates

      - name: 上传产物
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LapTimer-ipa
          path: |
            build/ipa/*.ipa
            build/*.xcarchive
          retention-days: 14
