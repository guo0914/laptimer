# GitHub Actions：在云端 macOS 编出「未签名 ipa」
#
# 这条路不需要 Mac、不需要 Apple 账号、不需要任何 Secrets。
# 产物下载后在 Windows 上用 Sideloadly + 你自己的免费 Apple ID 签名装机。
#
# 用法：
#   1. 把 timer-app/ios/LapTimer 目录内容推成 GitHub 仓库（目录内容作为仓库根）
#   2. 仓库设为 Public（私有仓库的 macOS 分钟数消耗很快，且要计费）
#   3. Actions → "iOS Unsigned IPA" → Run workflow
#   4. 跑完在 Artifacts 里下载 LapTimer-unsigned-ipa

name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LapTimer/**"
      - "Scripts/**"

jobs:
  unsigned-ipa:
    name: Build unsigned ipa
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 静态检查
        run: |
          python3 Scripts/structure-check.py
          python3 Scripts/api-check.py
          python3 Scripts/check-project.py

      - name: 逻辑自检
        run: |
          swiftc LapTimer/TimeFormatting.swift Scripts/logic-check.swift -o /tmp/logiccheck
          /tmp/logiccheck

      - name: 归档（关闭代码签名）
        run: |
          xcodebuild archive \
            -project LapTimer.xcodeproj \
            -scheme LapTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LapTimer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 打包 ipa
        run: |
          set -euo pipefail
          APP="build/LapTimer.xcarchive/Products/Applications/LapTimer.app"
          test -d "$APP" || { echo "找不到已编译的 .app"; exit 1; }
          rm -rf build/Payload build/LapTimer-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry LapTimer-unsigned.ipa Payload
          ls -lh LapTimer-unsigned.ipa
          unzip -l LapTimer-unsigned.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LapTimer-unsigned-ipa
          path: build/LapTimer-unsigned.ipa
          retention-days: 30
